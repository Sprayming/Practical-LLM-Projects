# legal-doc-rag 生产反向代理 + HTTPS 配置
# 作用：TLS 终止 + SSE 流式支持 + 反代到本地 uvicorn（多 worker）
#
# 部署步骤：
#   1. 将本文件放到 /etc/nginx/sites-available/legal-doc-rag
#   2. 软链：sudo ln -s /etc/nginx/sites-available/legal-doc-rag /etc/nginx/sites-enabled/
#   3. 先以 80 端口 + 80 跳转版本启动 Nginx，跑 ./setup-ssl.sh 申请证书（certbot 会自动改写本文件启用 443）
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   - upstream 默认只有一个 server（单实例多 worker 即可并发）。
#   - 若要做「真·多副本负载」，在部署机上启动多个 uvicorn（端口 8001/8002/8003），
#     在此 upstream 追加 server 行即可，Nginx 默认轮询负载均衡。

# 后端实例池（水平扩展时在此追加）
upstream legal_doc_rag {
    # 单实例多 worker：一个足够；多副本时取消下面注释并相应启动多个 uvicorn
    server 127.0.0.1:8000;
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    keepalive 32;
}

# HTTP 80：证书签发验证 + 全量跳转 HTTPS
server {
    listen 80;
    server_name rag.yourdomain.com;

    # Let's Encrypt HTTP-01 验证目录（certbot 使用）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443：对外服务入口
server {
    listen 443 ssl;
    server_name rag.yourdomain.com;

    # 证书路径（由 certbot 生成；申请前此段可被注释，申请后自动补全）
    ssl_certificate     /etc/letsencrypt/live/rag.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 文档上传允许较大体积
    client_max_body_size 100m;

    # —— SSE 流式问答关键配置 ——
    # 关闭代理缓冲，保证 token 实时推到前端；拉长读写超时避免长回答被截断。
    location / {
        proxy_pass http://legal_doc_rag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # 健康检查：前端监控 / 负载均衡探活用，免鉴权
    location = /health {
        proxy_pass http://legal_doc_rag/health;
        access_log off;
    }
}
