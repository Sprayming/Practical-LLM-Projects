services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-df9c9b2d-35d9-4df6-b49d-f489708e1eab}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-ep-m-20251117205847-trwgz}
      - EMBEDDER_TYPE=${EMBEDDER_TYPE:-openai}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-pro}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    volumes:
      - model_cache:/app/model_cache
      - memory_db:/app/memory_db
      - data_files:/app/data
      - logs:/app/logs
      - conversations:/app/conversations
      - cache:/app/cache
      - uploads:/app/uploads
      - chroma_db:/app/chroma_db
      - ./app:/app/app
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: python -c "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/api/health'); exit(0 if r.status==200 else 1)"
      start_period: 30s
      interval: 120s
      timeout: 5s
      retries: 3
  

volumes:
  redis_data:
  model_cache:
  memory_db:
  data_files:
  logs:
  conversations:

  uploads:
  chroma_db:
  cache:

