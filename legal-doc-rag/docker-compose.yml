version: "3.9"

services:
  redis:
    image: alpine:3.18
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.enableXsrfProtection=false
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-df9c9b2d-35d9-4df6-b49d-f489708e1eab}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-ep-m-20251117205847-trwgz}
      - EMBEDDER_TYPE=${EMBEDDER_TYPE:-openai}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    volumes:
      - model_cache:/app/model_cache
      - memory_db:/app/memory_db
      - data_files:/app/data
      - logs:/app/logs
      - conversations:/app/conversations
      - cache:/app/cache
      - uploads:/app/uploads
      - chroma_db:/app/chroma_db
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: python /app/healthcheck.py
      start_period: 0s
      interval: 30s
      timeout: 5s
      retries: 5
  

volumes:
  redis_data:
  model_cache:
  memory_db:
  data_files:
  logs:
  conversations:

  uploads:
  chroma_db:
  cache:
