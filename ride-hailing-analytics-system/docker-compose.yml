version: '3.8'

services:
  app:
    build: .
    container_name: ride-hailing-analytics
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=ride_hailing
      - DB_USER=root
      - DB_PASSWORD=password
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://api.deepseek.com/v1
      - LLM_MODEL=deepseek-chat
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: ride-hailing-db
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=ride_hailing
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: ride-hailing-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge