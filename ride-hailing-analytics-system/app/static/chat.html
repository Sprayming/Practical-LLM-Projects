<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 网约车智能问答系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --primary: #4f46e5;
    --primary-soft: #eef2ff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --user-bubble: #4f46e5;
    --ai-bubble: #f3f4f6;
    --code-bg: #1e293b;
    --code-text: #e2e8f0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    flex-shrink: 0;
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  header nav { display: flex; gap: 8px; }
  header nav a {
    color: #fff; text-decoration: none; font-size: 13px;
    padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,.14);
    transition: background .2s;
  }
  header nav a:hover { background: rgba(255,255,255,.28); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; margin-bottom: 18px; gap: 12px; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--primary); color: #fff; }
  .msg.ai .avatar { background: var(--primary-soft); }
  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.7;
    font-size: 14.5px;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-top-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }

  .sql-block, .data-block, .section { margin-top: 12px; }
  .sql-label, .sec-label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 5px; letter-spacing: .3px;
  }
  pre {
    background: var(--code-bg); color: var(--code-text);
    padding: 12px 14px; border-radius: 10px; overflow-x: auto;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px; line-height: 1.5;
  }
  table.dt {
    border-collapse: collapse; width: 100%; margin-top: 4px;
    font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  table.dt th, table.dt td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  table.dt th { background: var(--primary-soft); color: #3730a3; font-weight: 600; }
  table.dt tbody tr:nth-child(even) { background: #fafafa; }
  .md { font-size: 14px; line-height: 1.75; }
  .md .md-h { margin: 8px 0 4px; color: #3730a3; }
  .md b { color: #111827; }
  .meta { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .error { color: #b91c1c; background: #fef2f2; padding: 10px 12px; border-radius: 8px; font-size: 13px; }

  .dots { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: #9ca3af;
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  .examples {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 8px;
    max-width: 920px; margin: 0 auto; width: 100%;
  }
  .chip {
    background: var(--panel); border: 1px solid var(--border); color: var(--primary);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { background: var(--primary-soft); border-color: var(--primary); }

  .input-bar {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; gap: 12px; align-items: flex-end;
    max-width: 920px; margin: 0 auto; width: 100%;
  }
  .input-bar textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; font-size: 14.5px; font-family: inherit; line-height: 1.5;
    max-height: 140px; outline: none; transition: border .2s;
    background: #fff;
  }
  .input-bar textarea:focus { border-color: var(--primary); }
  .input-bar button {
    background: var(--primary); color: #fff; border: none; border-radius: 12px;
    padding: 0 22px; height: 46px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: background .2s; flex-shrink: 0;
  }
  .input-bar button:hover { background: #4338ca; }
  .input-bar button:disabled { background: #c7c9e8; cursor: not-allowed; }
  .hint { font-size: 11.5px; color: var(--muted); padding: 0 24px 12px; max-width: 920px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🚕</div>
    <div>
      <h1>AI 网约车智能问答系统</h1>
      <div class="sub">用自然语言提问，自动生成 SQL 查询运营数据库</div>
    </div>
  </div>
  <nav>
    <a href="/" style="background:rgba(255,255,255,.30)">问答</a>
    <a href="/dashboard">仪表盘</a>
    <a href="/apiview">API 文档</a>
  </nav>
</header>

<div id="chat"></div>

<div class="examples" id="examples">
  <div class="chip">上周订单总数是多少</div>
  <div class="chip">各券种核销率分别是多少</div>
  <div class="chip">今天的总成交额是多少</div>
  <div class="chip">哪个城市的订单量最高</div>
  <div class="chip">最近一周每天的订单趋势</div>
</div>
<div class="hint">提示：Enter 发送，Shift+Enter 换行。底层由 NL2SQL（自然语言转 SQL）驱动。</div>

<div class="input-bar">
  <textarea id="input" rows="1" placeholder="例如：上周订单总数是多少？各券种核销率如何？"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
let busy = false;

function escapeHtml(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function mdLite(text) {
  if (!text) return '';
  let s = escapeHtml(text);
  s = s.replace(/^###\s+(.+)$/gm, '<h4 class="md-h">$1</h4>');
  s = s.replace(/^##\s+(.+)$/gm, '<h4 class="md-h">$1</h4>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\n/g, '<br>');
  return s;
}
function buildTable(rows) {
  const cols = Object.keys(rows[0]);
  let t = '<table class="dt"><thead><tr>' +
    cols.map(c => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr></thead><tbody>';
  for (const r of rows) {
    t += '<tr>' + cols.map(c => '<td>' + escapeHtml(r[c]) + '</td>').join('') + '</tr>';
  }
  return t + '</tbody></table>';
}
function renderResult(res) {
  let h = '';
  if (res.sql) {
    h += '<div class="sql-block"><div class="sql-label">生成 SQL</div><pre><code>' +
      escapeHtml(res.sql) + '</code></pre></div>';
  }
  if (res.data && res.data.length) {
    h += '<div class="data-block"><div class="sql-label">查询结果（' + res.data.length + ' 行）</div>' +
      buildTable(res.data) + '</div>';
  } else if (res.sql) {
    h += '<div class="meta">该查询未返回明细数据。</div>';
  }
  if (res.summary) h += '<div class="section"><div class="sec-label">数据解读</div><div class="md">' + mdLite(res.summary) + '</div></div>';
  if (res.insight) h += '<div class="section"><div class="sec-label">分析思路</div><div class="md">' + mdLite(res.insight) + '</div></div>';
  if (res.recommendation) h += '<div class="section"><div class="sec-label">运营建议</div><div class="md">' + mdLite(res.recommendation) + '</div></div>';
  h += '<div class="meta">耗时 ' + (res.latency_ms || 0) + ' ms</div>';
  return h;
}

let bubbleSeq = 0;
function addBubble(role, html) {
  const id = 'b' + (++bubbleSeq);
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const avatar = role === 'user' ? '🙋' : '🤖';
  msg.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble" id="' + id + '">' + html + '</div>';
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
  return id;
}
function updateBubble(id, html) {
  const el = document.getElementById(id);
  if (el) { el.innerHTML = html; chatEl.scrollTop = chatEl.scrollHeight; }
}

function appendWelcome() {
  addBubble('ai', '你好 👋 我是网约车运营数据分析助手。<br>你可以直接用自然语言问我运营数据相关的问题，例如：<br>· 上周订单总数是多少？<br>· 各券种核销率如何？<br>· 今天的总成交额是多少？<br>我会自动生成 SQL、查询数据库并给出解读与建议。');
}

async function send(q) {
  if (busy || !q.trim()) return;
  busy = true; sendBtn.disabled = true;
  addBubble('user', escapeHtml(q));
  const loadingId = addBubble('ai', '<div class="dots"><span></span><span></span><span></span></div>');
  try {
    const resp = await fetch('/api/query/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const data = await resp.json();
    let html;
    if (!resp.ok) {
      html = '<div class="error">请求失败（' + resp.status + '）：' + escapeHtml(data.detail || '未知错误') + '</div>';
    } else {
      html = renderResult(data);
    }
    updateBubble(loadingId, html);
  } catch (e) {
    updateBubble(loadingId, '<div class="error">网络错误：' + escapeHtml(e.message) + '<br>请确认服务已启动（默认 http://127.0.0.1:8001）。</div>');
  } finally {
    busy = false; sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', () => { const q = inputEl.value; inputEl.value = ''; autoGrow(); send(q); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const q = inputEl.value; inputEl.value = ''; autoGrow(); send(q); }
});
document.getElementById('examples').addEventListener('click', (e) => {
  if (e.target.classList.contains('chip')) send(e.target.textContent);
});
function autoGrow() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px'; }
inputEl.addEventListener('input', autoGrow);

appendWelcome();
</script>
</body>
</html>
